version: "3.8"

services:
  db:
    image: mariadb:11
    container_name: zxt-db
    environment:
      - MARIADB_ROOT_PASSWORD=${DB_PASS:-zxt_oj_pass_2026}
    volumes:
      - ./oj-mysql:/var/lib/mysql
    restart: unless-stopped

  judge:
    build: ./judge
    container_name: zxt-judge
    ports:
      - "${JUDGE_PORT:-18000}:8000"
    environment:
      - JUDGE_PORT=8000
      - JUDGE_CPU_LIMIT=${JUDGE_CPU_LIMIT:-0.5}
      - JUDGE_MEM_LIMIT=${JUDGE_MEM_LIMIT:-512m}
      - JUDGE_POOL_SIZE=${JUDGE_POOL_SIZE:-3}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /data:/data
      - /tmp/judge_workspace:/tmp/judge_workspace
      - /tmp/judge_shared:/tmp/judge_shared
    restart: unless-stopped

  datamaker:
    build: ./datamaker
    container_name: zxt-datamaker
    ports:
      - "${DATAMAKER_PORT:-18002}:8000"   # 容器内 uvicorn 监听 8000（Dockerfile ENV）
    environment:
      - DATAMAKER_PORT=8000
      - DATA_ROOT=/data/problems
    volumes:
      - /data:/data
    restart: unless-stopped

  oj:
    build: ./oj
    container_name: zxt-oj
    ports:
      - "${OJ_PORT:-18001}:80"
    environment:
      - JUDGE_URL=${JUDGE_URL:-http://zxt-judge:8000}
      - DB_HOST=zxt-db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASS=${DB_PASS:-zxt_oj_pass_2026}
    volumes:
      - /data:/data
    depends_on:
      - db
      - judge
    restart: unless-stopped
