# 本机 php-fpm 状态页（监控用，仅 127.0.0.1 可访问）
server {
    listen 127.0.0.1:81;
    location = /status {
        fastcgi_pass 127.0.0.1:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /status;
        fastcgi_param SCRIPT_NAME /status;
        fastcgi_param REQUEST_URI /status;
        allow 127.0.0.1;
        deny all;
    }
}

server {
    listen 80;
    server_name _;
    root /var/www/oj;
    index index.php index.html;

    client_max_body_size 1024m;
    client_body_timeout 3600s;

    # 评测数据内部直连：nginx sendfile 零拷贝发送，不经过 PHP 内存
    location /oj_data/ {
        internal;
        alias /data/problems/;
    }

    # 数据包下载直传（nginx 零拷贝，不走 PHP）
    location /oj_packages/ {
        internal;
        alias /tmp/oj_packages/;
    }

    # 用户文件公开直链下载：IP:端口/files/用户名/存储文件名
    # 存储文件名带 uniqid 随机前缀（如 6a746c27165d9_big36.bin），URL 本身即访问凭证
    location /files/ {
        alias /data/userfiles/;
        autoindex off;
        add_header Content-Disposition "attachment";
        add_header Cache-Control "no-store";
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 3600s;
        fastcgi_send_timeout 3600s;
        include fastcgi_params;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
